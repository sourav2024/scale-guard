name: Release

# Push a tag like v1.0.0 to publish. See docs/releasing.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag matches package.json, plugin.json and SKILL.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p 'require("./package.json").version')
          PLG=$(node -p 'require("./.claude-plugin/plugin.json").version')
          echo "tag=$TAG package=$PKG plugin=$PLG"
          test "$TAG" = "$PKG" && test "$TAG" = "$PLG"

      - run: npm run verify

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release from the changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
